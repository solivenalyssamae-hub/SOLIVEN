<html>
<head>
<title>Registration Form</title>
</head>

<body bgcolor="white">

<center>
<table border="3" cellpadding="8" cellspacing="3"
       bgcolor="SkyBlue" width="650">

<tr>
<td colspan="2" align="center" bgcolor="Beige">
<h1><font color="#A66B69">Registration Form</font></h1>
</td>
</tr>

<tr>
<td>Enter Name</td>
<td><input type="text" size="30"></td>
</tr>

<tr>
<td>Enter Password</td>
<td><input type="password" size="30"></td>
</tr>

<tr>
<td>Enter Address</td>
<td><textarea rows="4" cols="30"></textarea></td>
</tr>

<tr>
<td>Select Game</td>
<td>
<input type="checkbox"> Hockey<br>
<input type="checkbox"> Football<br>
<input type="checkbox"> Badminton<br>
<input type="checkbox"> Cricket<br>
<input type="checkbox"> volleyball<br>
</td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Select ur age</td>
<td>
<select>
<option>Select</option>
<option>18</option>
<option>19</option>
<option>20</option>
<option>21</option>
<option>22</option>
</select>
</td>
</tr>

<tr>
<td>Select Photo</td>
<td><input type="file"></td>
</tr>

<tr>
<td colspan="2" align="center" bgcolor="#E8E8E8">
<input type="button" value="Click Me"
onclick="alert('Hello!')">
<input type="reset" value="Reset">
<input type="submit" value="Submit Form">
</td>
</tr>

</table>
</center>

</body>
</html>
